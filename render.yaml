services:
  - type: web
    name: smartbuy-ai-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: RECOMMENDATION_CACHE_BACKEND
        value: r2
      - key: R2_REQUIRED
        value: true
      - key: RECOMMENDATION_LOCK_TIMEOUT_SECONDS
        value: 150
