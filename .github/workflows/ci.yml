name: SmartBuy AI CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: smartbuy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -q && python -m pip install -r requirements.txt -q

      - name: Compile Python modules
        run: python -m compileall -q backend src tests

      - name: Run Python test suite
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt

      - name: Publish pytest failure summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pytest-output.txt';
            const raw = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'pytest 未產生輸出檔。';
            const tail = raw.length > 12000 ? raw.slice(-12000) : raw;
            const body = [
              '## CI｜Backend pytest 失敗摘要',
              '',
              '```text',
              tail,
              '```',
              '',
              `Workflow run: ${context.runId}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend regression tests
        id: frontend-tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test-output.txt

      - name: Build frontend and enforce bundle budget
        id: frontend-build
        shell: bash
        run: |
          set -o pipefail
          npm run build:check 2>&1 | tee frontend-build-output.txt

      - name: Publish frontend failure summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = [
              ['Frontend regression tests', 'frontend/frontend-test-output.txt'],
              ['Frontend build / bundle budget', 'frontend/frontend-build-output.txt'],
            ];
            const sections = files.map(([title, path]) => {
              const raw = fs.existsSync(path)
                ? fs.readFileSync(path, 'utf8')
                : `${title} 未產生輸出檔。`;
              const tail = raw.length > 8000 ? raw.slice(-8000) : raw;
              return [`### ${title}`, '', '```text', tail, '```'].join('\n');
            });
            const body = [
              '## CI｜Frontend 失敗摘要',
              '',
              ...sections,
              '',
              `Workflow run: ${context.runId}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  browser-e2e:
    name: Browser E2E and accessibility
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.61.1

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Build production frontend
        run: npm run build

      - name: Run browser E2E suite
        id: browser-e2e
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee browser-e2e-output.txt

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish browser E2E failure summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'frontend/browser-e2e-output.txt';
            const raw = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'Browser E2E 未產生輸出檔。';
            const tail = raw.length > 12000 ? raw.slice(-12000) : raw;
            const body = [
              '## CI｜Browser E2E / Accessibility 失敗摘要',
              '',
              '```text',
              tail,
              '```',
              '',
              '失敗 trace、影片與截圖已上傳至 workflow artifacts。',
              `Workflow run: ${context.runId}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
