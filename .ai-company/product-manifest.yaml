schemaVersion: "1.0"
productId: smartbuy-ai
productName: SmartBuy AI｜便宜買 AI
productVersion: 0.1.0
productKind: software-product
productLineId: consumer-intelligence
primaryRepository: gshan1209-cell/smartbuy-ai

ownership:
  productOwner: smartbuy-product-owner
  primaryOperatingUnit: system-development-studio
  participatingUnits:
    - multimedia-studio
    - ai-module-factory

lifecycle:
  mode: triad-full-cycle
  status: active

architecture:
  pattern: ai-power-armor
  baseSystem: product-core
  profilePolicy: right-sized
  supportedArmorProfiles:
    - light
  defaultArmorProfile: light
  expansionMode: cumulative-capability-layers
  currentArmorStage: original
  aiDependencyPolicy: enhancement-only
  coreWorksWithoutAi: true
  gracefulDegradationRequired: true
  aiFailurePolicyRef: docs/architecture/AI_FAILURE_AND_FALLBACK.md
  compatibilityContractRef: docs/architecture/ARMOR_COMPATIBILITY.md
  armorHostRef: .ai-company/armor-host.yaml
  armorLockRef: .ai-company/armor-lock.yaml
  armorProfileContractRef: docs/architecture/AI_ARMOR_PROFILE.md
  aiCapabilities:
    - capabilityId: role-recommendation-json
      armorProfile: light
      mode: request-response
      outputType: structured-json
      fallback: rule-recommendation
      schemaRef: recommendation-schema-v2
      cachePolicy: cache-first-create-if-absent

moduleComposition:
  lockFile: .ai-company/module-lock.yaml
  registrySearchRequired: true
  productSpecificCapabilities:
    - agriculture-market-intelligence
    - price-direction-prediction
    - seasonal-buying-guidance
    - consumer-farmer-merchant-recommendations
    - mutual-aid-network
    - rewards-and-coupons

independentOperation:
  build: true
  test: true
  deploy: true
  release: true
  requiresCeoRuntime: false
  requiresStudioRuntime: false

releasePolicy:
  versionedReleaseRequired: true
  rollbackRequired: true
  releaseRecordPath: .ai-company/releases/
  environments:
    - local
    - ci
    - preview
    - production
